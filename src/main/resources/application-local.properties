spring.config.activate.on-profile=local
# Datasource configuration for local development
spring.datasource.url=jdbc:postgresql://localhost:5432/personal-branding-saas
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.jpa.show-sql=true
# Redis defaults when running docker-compose locally
spring.data.redis.host=localhost
spring.data.redis.port=6379
#spring.data.redis.password=${REDIS_PASSWORD:}
spring.data.redis.ssl.enabled=false
# Kafka broker exposed by docker-compose (PLAINTEXT_HOST listener)
spring.kafka.bootstrap-servers=localhost:29092
# Local JWT defaults (can be overridden via environment variables)
security.jwt.secret=${SECURITY_JWT_SECRET:local-development-secret}
security.jwt.issuer=${SECURITY_JWT_ISSUER:personal-branding-saas-local}
security.sessions.max-active=5
security.login.rate-limiter=redis
security.refresh.rate-limiter=redis
# UI clients frequently used in development
app.cors.allowed-origins=http://localhost:3000,http://192.168.100.3:3000,http://pb.local:3000,https://pb.local,http://172.20.10.2:3000
app.security.csp=default-src 'self'; img-src 'self' data:; font-src 'self'; script-src 'self'; style-src 'self'; connect-src 'self' http://localhost:3000 http://192.168.100.3:3000 http://172.20.10.2:3000 http://192.168.100.3:8080 http://172.20.10.2:8080 http://pb.local:3000 http://pb.local:8080 https://pb.local https://pb.local:443
# Mail provider defaults (Resend HTTP API)
app.mail.from=${MAIL_FROM:dev-notifications@pb.local}
app.mail.resend.api-key=${MAIL_PROVIDER_API_KEY:re_local_placeholder}
app.mail.resend.base-url=${MAIL_PROVIDER_BASE_URL:https://api.resend.com}
app.mail.reset-base-url=${APP_MAIL_RESET_BASE_URL:https://pb.local/reset-password?token=}
app.mail.verify-base-url=${APP_MAIL_VERIFY_BASE_URL:https://pb.local/verify-email?token=}
# Local asset storage
app.assets.dir=${APP_ASSETS_DIR:./tmp-home/uploads}
app.assets.base-url=${APP_ASSETS_BASE_URL:}
# Auth cookie defaults for local development
security.refresh-cookie.secure=false
security.refresh-cookie.path=/api/auth
security.refresh-cookie.same-site=Lax
security.refresh-cookie.domain=${SECURITY_REFRESH_COOKIE_DOMAIN:pb.local}
# Local master key for encrypting platform credentials (override via APP_ENCRYPTION_KEY in real environments)
app.encryption.master-key=${APP_ENCRYPTION_KEY:00000000000000000000000000000000}
app.encryption.algorithm=${APP_ENCRYPTION_ALGORITHM:AES/GCM/NoPadding}
app.encryption.key-id=${APP_ENCRYPTION_KEY_ID:local-dev}
# Meta / Instagram OAuth defaults (override via env vars)
app.platform.meta.client-id=${META_CLIENT_ID:local-meta-client-id}
app.platform.meta.client-secret=${META_CLIENT_SECRET:local-meta-client-secret}
app.platform.meta.redirect-uri=${META_REDIRECT_URI:https://pb.local/meta/callback}
app.platform.meta.scopes=${META_SCOPES:instagram_basic,instagram_content_publish,pages_show_list,pages_manage_posts,business_management,pages_read_engagement,instagram_manage_comments,instagram_manage_insights,instagram_manage_messages,instagram_branded_content_brand,instagram_branded_content_creator}
app.platform.meta.api-version=${META_API_VERSION:v24.0}
app.platform.meta.platform-name=${META_PLATFORM_NAME:Instagram}
app.platform.meta.auth-base-url=${META_AUTH_BASE_URL:https://www.facebook.com}
app.platform.meta.graph-base-url=${META_GRAPH_BASE_URL:https://graph.facebook.com}
app.platform.meta.state-ttl=${META_STATE_TTL:PT10M}
# TikTok OAuth defaults
app.platform.tiktok.client-key=${TIKTOK_CLIENT_KEY:local-tiktok-client-key}
app.platform.tiktok.client-secret=${TIKTOK_CLIENT_SECRET:local-tiktok-client-secret}
app.platform.tiktok.redirect-uri=${TIKTOK_REDIRECT_URI:https://pb.local/tiktok/callback}
app.platform.tiktok.scopes=${TIKTOK_SCOPES:user.info.basic,video.publish}
app.platform.tiktok.auth-base-url=${TIKTOK_AUTH_BASE_URL:https://www.tiktok.com}
app.platform.tiktok.api-base-url=${TIKTOK_API_BASE_URL:https://open.tiktokapis.com}
app.platform.tiktok.state-ttl=${TIKTOK_STATE_TTL:PT10M}
app.platform.tiktok.platform-name=${TIKTOK_PLATFORM_NAME:TikTok}
# YouTube OAuth defaults
app.platform.youtube.client-id=${YOUTUBE_CLIENT_ID:local-youtube-client-id}
app.platform.youtube.client-secret=${YOUTUBE_CLIENT_SECRET:local-youtube-client-secret}
app.platform.youtube.redirect-uri=${YOUTUBE_REDIRECT_URI:https://pb.local/youtube/callback}
app.platform.youtube.scopes=${YOUTUBE_SCOPES:https://www.googleapis.com/auth/youtube.readonly}
app.platform.youtube.auth-base-url=${YOUTUBE_AUTH_BASE_URL:https://accounts.google.com}
app.platform.youtube.token-url=${YOUTUBE_TOKEN_URL:https://oauth2.googleapis.com/token}
app.platform.youtube.api-base-url=${YOUTUBE_API_BASE_URL:https://www.googleapis.com}
app.platform.youtube.state-ttl=${YOUTUBE_STATE_TTL:PT10M}
app.platform.youtube.platform-name=${YOUTUBE_PLATFORM_NAME:YouTube}
