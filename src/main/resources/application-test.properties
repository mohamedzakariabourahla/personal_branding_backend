spring.config.activate.on-profile=test

spring.datasource.url=jdbc:h2:mem:personal_branding;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;CASE_INSENSITIVE_IDENTIFIERS=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.show-sql=false
spring.jpa.hibernate.ddl-auto=none
spring.flyway.enabled=false

security.jwt.secret=test-jwt-secret
security.jwt.issuer=test-suite
security.login.rate-limiter=memory
security.refresh.rate-limiter=memory
security.sessions.max-active=3

spring.mail.host=localhost
spring.mail.port=2525
spring.mail.username=
spring.mail.password=
app.mail.from=test@example.com
app.mail.reset-base-url=http://localhost/reset-password?token=
app.mail.verify-base-url=http://localhost/verify-email?token=

app.encryption.master-key=abcdef0123456789abcdef0123456789
app.encryption.algorithm=AES/GCM/NoPadding
app.encryption.key-id=test

app.platform.meta.client-id=test-meta-client-id
app.platform.meta.client-secret=test-meta-client-secret
app.platform.meta.redirect-uri=http://localhost/meta/callback
app.platform.meta.scopes=pages_show_list,instagram_basic
app.platform.meta.api-version=v20.0
app.platform.meta.platform-name=Instagram
app.platform.meta.auth-base-url=https://www.facebook.com
app.platform.meta.graph-base-url=https://graph.facebook.com
app.platform.meta.state-ttl=PT5M

app.platform.tiktok.client-key=test-tiktok-client-key
app.platform.tiktok.client-secret=test-tiktok-client-secret
app.platform.tiktok.redirect-uri=http://localhost/tiktok/callback
app.platform.tiktok.scopes=user.info.basic,video.publish
app.platform.tiktok.auth-base-url=https://www.tiktok.com
app.platform.tiktok.api-base-url=https://open.tiktokapis.com
app.platform.tiktok.state-ttl=PT5M
app.platform.tiktok.platform-name=TikTok
app.platform.youtube.client-id=test-youtube-client-id
app.platform.youtube.client-secret=test-youtube-client-secret
app.platform.youtube.redirect-uri=http://localhost/youtube/callback
app.platform.youtube.scopes=https://www.googleapis.com/auth/youtube.readonly
app.platform.youtube.auth-base-url=https://accounts.google.com
app.platform.youtube.token-url=https://oauth2.googleapis.com/token
app.platform.youtube.api-base-url=https://www.googleapis.com
app.platform.youtube.state-ttl=PT5M
app.platform.youtube.platform-name=YouTube
