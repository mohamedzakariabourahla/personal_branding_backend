<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Reset your password</title>
  </head>
  <body
    style="font-family: Arial, sans-serif; color: #1f2937; line-height: 1.5"
  >
    <p>Hi there,</p>
    <p>
      We received a request to reset your password. Click the link below to
      choose a new one:
    </p>
    <p>
      <a
        href="{{resetLink}}"
        style="
          display: inline-block;
          padding: 10px 16px;
          background-color: #2563eb;
          color: #ffffff;
          text-decoration: none;
          border-radius: 6px;
        "
      >
        Reset password
      </a>
    </p>
    <p>If you didn't request this, you can ignore this email.</p>
  </body>
</html>
