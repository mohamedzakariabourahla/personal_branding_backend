<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Verify your email</title>
  </head>
  <body style="font-family: Arial, sans-serif; color: #1f2937; line-height: 1.5;">
    <p>Welcome!</p>
    <p>Thanks for signing up. Please confirm your email address to unlock your account:</p>
    <p>
      <a
        href="{{verificationLink}}"
        style="display: inline-block; padding: 10px 16px; background-color: #2563eb; color: #ffffff; text-decoration: none; border-radius: 6px;"
      >
        Verify email
      </a>
    </p>
    <p style="margin-top: 16px;">
      If the button does not work, copy and paste this verification token on the site:
    </p>
    <p
      style="display: inline-block; padding: 8px 12px; background-color: #f3f4f6; border-radius: 4px; font-family: 'Courier New', monospace; letter-spacing: 0.08em;"
    >
      {{verificationToken}}
    </p>
    <p>If you didn't create an account, you can ignore this email.</p>
  </body>
</html>
