spring.application.name=personal_branding
server.port=8080

# PostgreSQL datasource
spring.datasource.url=jdbc:postgresql://localhost:5432/personal-branding-saas
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA/Hibernate
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Flyway
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true

# JWT security configuration
security.jwt.secret=${SECURITY_JWT_SECRET}
security.jwt.issuer=personal-branding-saas
security.jwt.access-token-ttl=PT15M
security.jwt.refresh-token-ttl=P7D
