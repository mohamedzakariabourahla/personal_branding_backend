spring.application.name=personal_branding
server.port=${SERVER_PORT:8080}
server.address=${SERVER_ADDRESS:0.0.0.0}

# PostgreSQL datasource
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/personal-branding-saas}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver
# JPA/Hibernate
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
# Flyway
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
# JWT security configuration
security.jwt.secret=${SECURITY_JWT_SECRET:just-anormal-secret}
security.jwt.issuer=${SECURITY_JWT_ISSUER:personal-branding-saas}
security.jwt.access-token-ttl=${SECURITY_JWT_ACCESS_TTL:PT12M}
security.jwt.refresh-token-ttl=${SECURITY_JWT_REFRESH_TTL:PT5M}
# CORS
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:3000,http://192.168.100.3:3000}
# Login/refresh rate limiting
security.login.max-attempts=${SECURITY_LOGIN_MAX_ATTEMPTS:5}
security.login.window=${SECURITY_LOGIN_WINDOW:PT15M}
security.refresh.max-attempts=${SECURITY_REFRESH_MAX_ATTEMPTS:20}
security.refresh.window=${SECURITY_REFRESH_WINDOW:PT10M}
# Security headers
app.security.csp=${APP_SECURITY_CSP:default-src 'self'; img-src 'self' data:; font-src 'self'; script-src 'self'; style-src 'self'; connect-src 'self' http://localhost:3000 http://192.168.100.3:3000 http://192.168.100.3:8080}
app.security.frame-ancestors=${APP_SECURITY_FRAME_ANCESTORS:none}

# Mail (defaults for local development via Mailtrap)
spring.mail.host=${MAIL_HOST:smtp.mailtrap.io}
spring.mail.port=${MAIL_PORT:2525}
spring.mail.username=${MAIL_USERNAME:username}
spring.mail.password=${MAIL_PASSWORD:password}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000
app.mail.from=${MAIL_FROM:no-reply@local.test}
app.mail.reset-base-url=${APP_MAIL_RESET_BASE_URL:http://localhost:3000/reset-password?token=}
app.mail.verify-base-url=${APP_MAIL_VERIFY_BASE_URL:http://localhost:3000/verify-email?token=}

security.password-reset.token-ttl=${SECURITY_PASSWORD_RESET_TOKEN_TTL:PT15M}
security.email-verification.token-ttl=${SECURITY_EMAIL_VERIFICATION_TOKEN_TTL:PT24H}

