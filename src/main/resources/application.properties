spring.application.name=personal_branding
server.port=${SERVER_PORT:8080}
server.address=${SERVER_ADDRESS:0.0.0.0}

spring.profiles.active=${SPRING_PROFILES_ACTIVE:local}

spring.datasource.url=${SPRING_DATASOURCE_URL:}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=${SPRING_JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

spring.flyway.enabled=${SPRING_FLYWAY_ENABLED:true}
spring.flyway.baseline-on-migrate=true

spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.password=${REDIS_PASSWORD:}
spring.data.redis.ssl.enabled=${REDIS_SSL_ENABLED:false}
spring.data.redis.timeout=${REDIS_TIMEOUT:PT5S}

security.jwt.secret=${SECURITY_JWT_SECRET:}
security.jwt.issuer=${SECURITY_JWT_ISSUER:personal-branding-saas}
security.sessions.max-active=${SECURITY_SESSIONS_MAX_ACTIVE:5}
security.jwt.access-token-ttl=${SECURITY_JWT_ACCESS_TTL:PT12M}
security.jwt.refresh-token-ttl=${SECURITY_JWT_REFRESH_TTL:PT5M}

security.login.max-attempts=${SECURITY_LOGIN_MAX_ATTEMPTS:5}
security.login.window=${SECURITY_LOGIN_WINDOW:PT15M}
security.login.rate-limiter=${SECURITY_LOGIN_RATE_LIMITER:redis}
security.refresh.max-attempts=${SECURITY_REFRESH_MAX_ATTEMPTS:20}
security.refresh.window=${SECURITY_REFRESH_WINDOW:PT10M}
security.refresh.rate-limiter=${SECURITY_REFRESH_RATE_LIMITER:redis}
security.password-reset.token-ttl=${SECURITY_PASSWORD_RESET_TOKEN_TTL:PT15M}
security.email-verification.token-ttl=${SECURITY_EMAIL_VERIFICATION_TOKEN_TTL:PT24H}
security.email-verification.resend-window=${SECURITY_EMAIL_VERIFICATION_RESEND_WINDOW:PT1M}

app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:3000}
app.security.csp=${APP_SECURITY_CSP:default-src 'self'; img-src 'self' data:; font-src 'self'; script-src 'self'; style-src 'self'; connect-src 'self'}
app.security.frame-ancestors=${APP_SECURITY_FRAME_ANCESTORS:none}

app.mail.from=${MAIL_FROM:}
app.mail.reset-base-url=${APP_MAIL_RESET_BASE_URL:}
app.mail.verify-base-url=${APP_MAIL_VERIFY_BASE_URL:}
app.mail.resend.api-key=${MAIL_PROVIDER_API_KEY:}
app.mail.resend.base-url=${MAIL_PROVIDER_BASE_URL:https://api.resend.com}

app.encryption.master-key=${APP_ENCRYPTION_KEY:}
app.encryption.algorithm=${APP_ENCRYPTION_ALGORITHM:AES/GCM/NoPadding}
app.encryption.key-id=${APP_ENCRYPTION_KEY_ID:default}

app.platform.meta.client-id=${META_CLIENT_ID:}
app.platform.meta.client-secret=${META_CLIENT_SECRET:}
app.platform.meta.redirect-uri=${META_REDIRECT_URI:https://localhost:8080/api/platforms/meta/oauth/callback}
app.platform.meta.scopes=${META_SCOPES:instagram_basic,instagram_content_publish,pages_show_list,business_management,pages_read_engagement}
app.platform.meta.api-version=${META_API_VERSION:v20.0}
app.platform.meta.platform-name=${META_PLATFORM_NAME:Instagram}
app.platform.meta.auth-base-url=${META_AUTH_BASE_URL:https://www.facebook.com}
app.platform.meta.graph-base-url=${META_GRAPH_BASE_URL:https://graph.facebook.com}
app.platform.meta.state-ttl=${META_STATE_TTL:PT10M}

app.platform.tiktok.client-key=${TIKTOK_CLIENT_KEY:}
app.platform.tiktok.client-secret=${TIKTOK_CLIENT_SECRET:}
app.platform.tiktok.redirect-uri=${TIKTOK_REDIRECT_URI:https://localhost:8080/api/platforms/tiktok/oauth/callback}
app.platform.tiktok.scopes=${TIKTOK_SCOPES:user.info.basic,video.publish}
app.platform.tiktok.auth-base-url=${TIKTOK_AUTH_BASE_URL:https://www.tiktok.com}
app.platform.tiktok.api-base-url=${TIKTOK_API_BASE_URL:https://open.tiktokapis.com}
app.platform.tiktok.state-ttl=${TIKTOK_STATE_TTL:PT10M}
app.platform.tiktok.platform-name=${TIKTOK_PLATFORM_NAME:TikTok}

app.platform.youtube.client-id=${YOUTUBE_CLIENT_ID:}
app.platform.youtube.client-secret=${YOUTUBE_CLIENT_SECRET:}
app.platform.youtube.redirect-uri=${YOUTUBE_REDIRECT_URI:https://localhost:8080/api/platforms/youtube/oauth/callback}
app.platform.youtube.scopes=${YOUTUBE_SCOPES:https://www.googleapis.com/auth/youtube.readonly}
app.platform.youtube.auth-base-url=${YOUTUBE_AUTH_BASE_URL:https://accounts.google.com}
app.platform.youtube.token-url=${YOUTUBE_TOKEN_URL:https://oauth2.googleapis.com/token}
app.platform.youtube.api-base-url=${YOUTUBE_API_BASE_URL:https://www.googleapis.com}
app.platform.youtube.state-ttl=${YOUTUBE_STATE_TTL:PT10M}
app.platform.youtube.platform-name=${YOUTUBE_PLATFORM_NAME:YouTube}
