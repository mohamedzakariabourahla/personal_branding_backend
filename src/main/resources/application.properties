spring.application.name=personal_branding
server.port=${SERVER_PORT:8080}
server.address=${SERVER_ADDRESS:0.0.0.0}

spring.profiles.active=${SPRING_PROFILES_ACTIVE:local}

spring.datasource.url=${SPRING_DATASOURCE_URL:}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=${SPRING_JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

spring.flyway.enabled=${SPRING_FLYWAY_ENABLED:true}
spring.flyway.baseline-on-migrate=true

spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.password=${REDIS_PASSWORD:}
spring.data.redis.ssl.enabled=${REDIS_SSL_ENABLED:false}
spring.data.redis.timeout=${REDIS_TIMEOUT:PT5S}

security.jwt.secret=${SECURITY_JWT_SECRET:}
security.jwt.issuer=${SECURITY_JWT_ISSUER:personal-branding-saas}
security.sessions.max-active=${SECURITY_SESSIONS_MAX_ACTIVE:5}
security.jwt.access-token-ttl=${SECURITY_JWT_ACCESS_TTL:PT12M}
security.jwt.refresh-token-ttl=${SECURITY_JWT_REFRESH_TTL:PT5M}

security.login.max-attempts=${SECURITY_LOGIN_MAX_ATTEMPTS:5}
security.login.window=${SECURITY_LOGIN_WINDOW:PT15M}
security.login.rate-limiter=${SECURITY_LOGIN_RATE_LIMITER:redis}
security.refresh.max-attempts=${SECURITY_REFRESH_MAX_ATTEMPTS:20}
security.refresh.window=${SECURITY_REFRESH_WINDOW:PT10M}
security.refresh.rate-limiter=${SECURITY_REFRESH_RATE_LIMITER:redis}
security.password-reset.token-ttl=${SECURITY_PASSWORD_RESET_TOKEN_TTL:PT15M}
security.email-verification.token-ttl=${SECURITY_EMAIL_VERIFICATION_TOKEN_TTL:PT24H}
security.email-verification.resend-window=${SECURITY_EMAIL_VERIFICATION_RESEND_WINDOW:PT1M}

app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:3000}
app.security.csp=${APP_SECURITY_CSP:default-src 'self'; img-src 'self' data:; font-src 'self'; script-src 'self'; style-src 'self'; connect-src 'self'}
app.security.frame-ancestors=${APP_SECURITY_FRAME_ANCESTORS:none}

spring.mail.host=${MAIL_HOST:localhost}
spring.mail.port=${MAIL_PORT:2525}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${MAIL_SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_SMTP_STARTTLS:true}
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

app.mail.from=${MAIL_FROM:}
app.mail.reset-base-url=${APP_MAIL_RESET_BASE_URL:}
app.mail.verify-base-url=${APP_MAIL_VERIFY_BASE_URL:}
